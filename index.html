<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Eleitoral - Tempo Real</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="globo-container">
    <div class="header-pesquisa">
        <span class="badge-ao-vivo">● AO VIVO</span>
        <h2>PESQUISA DE INTENÇÃO DE VOTO</h2>
        <p class="subtitulo">Simulação Pará 2026</p>
    </div>

    <div class="status-bar">
        <span id="datetime">--/--/---- --:--</span>
        <span id="total-votos-header">Total de votos: 0</span>
    </div>

    <!-- Os candidatos serão ordenados e inseridos dinamicamente aqui pelo JS -->
    <div id="candidates-list" class="candidates-container"></div>

    <div class="actions">
        <button onclick="compartilhar()" class="btn-share">Compartilhar Enquete</button>
    </div>

    <div class="footer-credits">
        Desenvolvido por: <strong>WKB SISTEMAS</strong> | 
        <a href="http://www.wkbsistemas.com.br" target="_blank">www.wkbsistemas.com.br</a>
    </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
